name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（插件 + 中继 + 手机端自检）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 全部零依赖，不需要 npm install —— 这一步本身就是个断言
      - name: 插件测试
        working-directory: plugin
        run: node --test "test/**/*.test.mjs"

      - name: 中继测试
        working-directory: relay
        run: node --test "test/**/*.test.mjs"

      - name: 手机端自检（Node + 最小 DOM，真跑 app.js）
        working-directory: plugin
        run: node tools/pwa-smoke.mjs

      - name: 零依赖断言（不该存在 node_modules 或 package-lock）
        run: |
          test ! -d plugin/node_modules
          test ! -d relay/node_modules

      - name: 诊断包不含令牌与路径（静态检查）
        run: |
          grep -rn "console.log(token" plugin/lib || true
          ! grep -rn "private key" plugin/lib relay

  android:
    name: 原生壳（assembleDebug）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # 不用 android-actions/setup-android：它在较新的 runner 镜像上会去装一个
      # 已被移除的 "tools" 包而失败。ubuntu-latest 自带 SDK，直接用现成的。
      - name: 装 SDK 组件
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # libtailscale.aar 不入库（见 android/README.md）；这里编的是 LAN/SYSTEM 模式的壳
      - name: 构建
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pocket-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error