<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="DSH" />
<meta name="format-detection" content="telephone=no" />
<title>DSH Mobile — DeepSeek Intelligence</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23123B72'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2349B7E8'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23EAF3FF' stroke-width='1.2' stroke-dasharray='3 3'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23123B72'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2349B7E8'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23EAF3FF' stroke-width='1.2' stroke-dasharray='3 3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="phone" id="app">
  <noscript><p class="boot-note">这个页面需要开启 JavaScript。</p></noscript>

  <!-- 顶栏 / 主区 / 底栏：全部由 views.js 按真实状态渲染 -->
  <header class="appbar" id="appbar"></header>
  <main class="main" id="main"></main>
  <nav class="bottomnav" id="nav"></nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

<!-- ══════════════════════════════════════════════════════════════════
     连接屏：唯一保留的静态结构（表单需要真实 input，便于自动填充/键盘）
     ══════════════════════════════════════════════════════════════════ -->
<section id="view-connect" class="view-connect" hidden aria-label="连接">
  <div class="connect-wrap">
    <div class="connect-brand">
      <span id="connect-mark"></span>
      <h1>DSH</h1>
      <p>DeepSeek Harness · 手机端</p>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <form id="pair-form" autocomplete="off" style="display:flex;flex-direction:column;gap:12px">
        <label class="field">
          <span class="field-label">服务器地址</span>
          <input id="pair-base" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
                 spellcheck="false" placeholder="http://…" />
        </label>
        <label class="field">
          <span class="field-label">配对码</span>
          <input id="pair-code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 autocomplete="one-time-code" placeholder="000000" class="code-input" />
        </label>
        <label class="field">
          <span class="field-label">设备名</span>
          <input id="pair-name" type="text" maxlength="32" autocomplete="off" />
        </label>
        <button id="pair-submit" class="btn primary" type="submit" style="height:46px">配对</button>
        <p id="pair-error" class="error" role="alert" hidden></p>
        <p class="hint">配对码在电脑上 <code>dsh web</code> 的启动日志里</p>
      </form>
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════════════════════════════════
     兼容层（隐藏）：app.js 是数据/流引擎，它仍按老 id 写 DOM。
     这些容器不可见，只用来接住它的渲染，可见界面全部由 views.js 产出。
     迁移完成后这份可以删掉 —— 列在这里是为了「不假装它不存在」。
     ══════════════════════════════════════════════════════════════════ -->
<div id="legacy-host" hidden aria-hidden="true">
  <section id="view-home"></section>
  <section id="view-list"><div id="list-banner" hidden></div>
    <ul id="list-cards"></ul><p id="list-empty" hidden></p>
    <form id="quick-form"><input id="quick-input" /><button id="quick-send" type="submit"></button></form>
    <span id="list-link"></span><button id="list-refresh" type="button"></button>
    <button id="list-settings" type="button"></button>
  </section>
  <section id="view-detail">
    <span id="detail-title"></span><span id="detail-sub"></span>
    <p id="detail-cache-note" hidden></p><p id="detail-live-note" hidden></p>
    <p id="detail-sync-off" hidden>这台电脑没启用内容同步</p>
    <ul id="detail-transcript"></ul><p id="detail-transcript-empty" hidden></p>
    <div id="detail-approvals"></div>
    <button id="detail-log-toggle" type="button"></button>
    <p id="detail-activity"></p><ul id="detail-log" hidden></ul>
    <textarea id="detail-text"></textarea>
    <button id="detail-queue" type="button"></button>
    <button id="detail-steer" type="button"></button>
    <button id="detail-cancel" type="button"></button>
    <button id="detail-gui" type="button"></button>
    <button id="detail-upload" type="button"></button>
    <button id="detail-back" type="button"></button>
    <input id="detail-file" type="file" hidden />
  </section>
  <section id="view-settings">
    <input id="set-base" /><input id="set-name" /><code id="set-token"></code>
    <input id="set-relay" /><input id="set-room" /><input id="set-notify" type="checkbox" />
    <button id="set-save" type="button"></button><button id="set-gui" type="button"></button>
    <button id="set-relay-save" type="button"></button><button id="set-probe" type="button"></button>
    <button id="set-diag" type="button"></button><button id="set-signout" type="button"></button>
    <code id="set-upstream"></code><code id="set-link"></code><code id="set-device"></code>
    <code id="set-sync"></code><code id="set-version"></code><span id="set-dot"></span>
  </section>
  <nav id="tabbar" hidden></nav>
</div>
    <ul id="list-cards"></ul><p id="list-empty" hidden></p>
    <form id="quick-form"><input id="quick-input" /><button id="quick-send" type="submit"></button></form>
  </section>
  <section id="view-detail">
    <span id="detail-title"></span><span id="detail-sub"></span>
    <p id="detail-cache-note" hidden></p><p id="detail-live-note" hidden></p><p id="detail-sync-off" hidden>这台电脑没启用内容同步</p>
    <ul id="detail-transcript"></ul><p id="detail-transcript-empty" hidden></p>
    <div id="detail-approvals"></div>
    <button id="detail-log-toggle" type="button"></button>
    <p id="detail-activity"></p><ul id="detail-log" hidden></ul>
    <textarea id="detail-text"></textarea>
    <button id="detail-queue" type="button"></button>
    <button id="detail-steer" type="button"></button>
    <button id="detail-cancel" type="button"></button>
    <button id="detail-gui" type="button"></button>
    <button id="detail-upload" type="button"></button>
    <input id="detail-file" type="file" hidden />
  </section>
  <section id="view-settings">
    <input id="set-base" /><input id="set-name" /><code id="set-token"></code>
    <input id="set-relay" /><input id="set-room" /><input id="set-notify" type="checkbox" />
    <button id="set-save" type="button"></button><button id="set-gui" type="button"></button>
    <button id="set-relay-save" type="button"></button><button id="set-probe" type="button"></button>
    <button id="set-diag" type="button"></button><button id="set-signout" type="button"></button>
    <code id="set-upstream"></code><code id="set-link"></code><code id="set-device"></code>
    <code id="set-sync"></code><code id="set-version"></code>
    <span id="set-dot"></span>
  </section>
    <span id="list-link"></span><button id="list-refresh" type="button"></button>
    <button id="list-settings" type="button"></button><button id="detail-back" type="button"></button>
    <nav id="tabbar" hidden></nav>
  </section>
</div>

<script src="./markdown.js"></script>
<script src="./views.js"></script>
<script src="./app.js"></script>
</body>
</html>
